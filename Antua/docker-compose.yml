# Base de datos y API. El front es opcional: docker compose --profile web up
# Las credenciales y los puertos salen de .env (ver .env.example). Acá no hay ninguna credencial.
services:
  db:
    image: mysql:26
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Definí DB_PASSWORD en .env}
      MYSQL_DATABASE: ${DB_DATABASE:-antua_db}
    ports:
      # Por defecto solo local y en el 3307: el 3306 puede estar ocupado por otro MySQL o MariaDB.
      - '${MYSQL_BIND:-127.0.0.1}:${MYSQL_PORT:-3307}:3306'
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: antua-api/Dockerfile
    env_file: antua-api/.env
    environment:
      # La imagen es la de producción (NODE_ENV=production). Este compose es de desarrollo: sin
      # esto, la API exigiría la configuración estricta de producción (ver docker-compose.prod.yml).
      NODE_ENV: development
      # Adentro de Docker la API llega a la base por el nombre del servicio.
      DB_HOST: db
      DB_PORT: '3306'
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?Definí DB_PASSWORD en .env}
      DB_DATABASE: ${DB_DATABASE:-antua_db}
      # Imágenes subidas desde el panel: en un volumen, para que sobrevivan a reinicios y rebuilds.
      UPLOADS_DIR: /data/uploads
    volumes:
      - uploads_data:/data/uploads
    ports:
      - '${API_BIND:-127.0.0.1}:${API_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    profiles: [web]
    build:
      context: .
      dockerfile: antua-web/Dockerfile.dev
    environment:
      VITE_API_URL: http://api:3000
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-5173}:5173'
    depends_on:
      api:
        condition: service_healthy

  # Correos de desarrollo: Mailpit recibe por SMTP y los muestra en el navegador, sin enviar nada
  # afuera. Solo en 127.0.0.1 (no se ve desde otras máquinas).
  #   docker compose --profile mail up -d mailpit      → http://127.0.0.1:8025
  # y en antua-api/.env: MAIL_TRANSPORT=smtp, MAIL_HOST=127.0.0.1, MAIL_PORT=1025, MAIL_FROM=…
  mailpit:
    profiles: [mail]
    image: axllent/mailpit:v1.33.0
    ports:
      - '127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  db_data:
  uploads_data:
