# Base de datos y API. El front es opcional: docker compose --profile web up
# Las credenciales y los puertos salen de .env (ver .env.example). Acá no hay ninguna credencial.
services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Definí DB_PASSWORD en .env}
      MYSQL_DATABASE: ${DB_DATABASE:-antua_db}
    ports:
      # Por defecto solo local y en el 3307: el 3306 puede estar ocupado por otro MySQL o MariaDB.
      - '${MYSQL_BIND:-127.0.0.1}:${MYSQL_PORT:-3307}:3306'
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: antua-api/Dockerfile
    env_file: antua-api/.env
    environment:
      # Adentro de Docker la API llega a la base por el nombre del servicio.
      DB_HOST: db
      DB_PORT: '3306'
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?Definí DB_PASSWORD en .env}
      DB_DATABASE: ${DB_DATABASE:-antua_db}
    ports:
      - '${API_BIND:-127.0.0.1}:${API_PORT:-3000}:3000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    profiles: [web]
    build:
      context: .
      dockerfile: antua-web/Dockerfile
    environment:
      VITE_API_URL: http://api:3000
    ports:
      - '${WEB_BIND:-127.0.0.1}:${WEB_PORT:-5173}:5173'
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
