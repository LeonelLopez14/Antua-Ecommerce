<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFBE9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Antua: galletas caseras, sin gluten, veganas y sin azúcar. Date un gustito." />
    <!-- Tema elegido (stores/themeStore.ts): se aplica antes del primer pintado para que no parpadee. -->
    <script>
      try {
        var theme = localStorage.getItem('antua.theme')
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.classList.add(theme)
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#151515' : '#FFFBE9')
          })
        }
      } catch (error) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@600;700&display=swap"
    />
    <title>Antua · Galletas caseras</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
