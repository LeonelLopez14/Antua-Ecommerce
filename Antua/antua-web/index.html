<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFBE9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#151515" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Antojarte: galletas caseras, sin gluten, veganas y sin azúcar. Date un gustito." />
    <!-- Open Graph por defecto. Cada página los actualiza (usePageMeta), pero sin SSR quien no ejecuta JavaScript ve estos. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Antojarte" />
    <meta property="og:locale" content="es_UY" />
    <meta property="og:title" content="Antojarte · Galletas caseras" />
    <meta property="og:description" content="Antojarte: galletas caseras, sin gluten, veganas y sin azúcar. Date un gustito." />
    <!-- Tema elegido: se aplica antes del primer pintado para que no parpadee. Va en un archivo
         (public/theme-init.js) y no en línea, para que la CSP no necesite 'unsafe-inline'. -->
    <script src="/theme-init.js"></script>
    <!-- Fuentes: servidas desde el sitio (src/index.css). El preload de las críticas lo agrega vite.config.ts. -->
    <title>Antojarte · Galletas caseras</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
